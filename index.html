<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6c34c">
<title>エモマップ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>エモマップ</h1>
</header>

<main>
  <section id="screen-record" class="screen active">
    <p class="prompt">いまの気分と体調をタップ</p>
    <div class="pad-wrap">
      <span class="axis-label ax-top">体調よい</span>
      <span class="axis-label ax-bottom">体調わるい</span>
      <span class="axis-label ax-left">気分<br>暗い</span>
      <span class="axis-label ax-right">気分<br>明るい</span>
      <div id="mood-pad" class="mood-pad">
        <span class="quad q-tl">😕</span>
        <span class="quad q-tr">😊</span>
        <span class="quad q-bl">😖</span>
        <span class="quad q-br">🤒</span>
      </div>
    </div>
    <p id="limit-msg" class="limit-msg"></p>
    <div id="today-logs" class="today-logs"></div>
  </section>

  <section id="screen-stats" class="screen">
    <div id="stats-content"></div>
  </section>

  <section id="screen-settings" class="screen">
    <h2>データ管理</h2>
    <div class="settings-actions">
      <button id="export-logs">記録をエクスポート (JSON)</button>
      <button id="delete-all-logs" class="danger-outline">全記録を削除</button>
    </div>
    <p class="note">記録はすべてこの端末内に保存されます。位置情報は約1kmに丸めた値のみ記録します。記録は1日3回までです。</p>
  </section>
</main>

<nav>
  <button data-screen="screen-record" class="active">✏️ 記録</button>
  <button data-screen="screen-stats">📊 統計</button>
  <button data-screen="screen-settings">⚙️ 設定</button>
</nav>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
